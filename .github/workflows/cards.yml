name: Profile cards
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths: [tools/cards.sh]
permissions:
  contents: write
concurrency: cards
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cards
        env:
          # CARDS_TOKEN (optional, read-only PAT) lets the language card see
          # private repositories; without it that card is left as it is.
          GH_TOKEN: ${{ secrets.CARDS_TOKEN || github.token }}
        run: bash tools/cards.sh thaxao Sunbringer-Astral Sunbringer-Meter
      - name: Commit
        run: |
          git diff --quiet -- assets && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Profile: refresh cards"
          git push
