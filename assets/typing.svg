        <textPath xlink:href='#path0'>
            Computer Science student · Software developer
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='6400ms' fill='remove'
